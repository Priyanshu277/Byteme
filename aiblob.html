<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeClas</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.5.0/css/all.css">
    <link rel="stylesheet" href="https://assets.codepen.io/2940219/tacosontitan-1.1.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css">
<link rel="stylesheet" href="aiblob.css">
    
</head>
<body>
    <div class="headlinks">
        <h5>help</h5>
    <h5>community</h5>
    
    </div>
    <div id="primary-content" class="centered-pen">
        <h1 class="display-3">He Buddy </h1>
        <p class="lead">Let's plan your adventure together! What's on your mind?</p>
        <div class="personal-assistant">
            <div id="felix" class="felix" onclick="activateFelix();">
                <div class="eyes">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>
            </div>
            <div class="platform"></div>
            <ul class="command-list">
                <li><i class="far fa-clouds" onclick="getWeather();"></i></li>
                <li><i class="far fa-clock" onclick="getTime();"></i></li>
                <li><i class="far fa-calendar-alt" onclick="getDate();"></i></li>
                <li><i class="far fa-grin-squint-tears" onclick="tellJoke();"></i></li>
                <li><i class="far fa-search" onclick="searchGoogle();"></i></li>
                <li><i class="far fa-lightbulb-on" onclick="showInspiration();"></i></li>
                <p class="hey-felix lead"></p>
            </ul>
        </div>
        <div id="response-frame" class="response-frame">
            <p id="response-message" class="lead"></p>
            <i class="fas fa-times" onclick="closeResponse();"></i>
        </div>
        
        <div class="sectionnn">
            <input id="start" type="text" placeholder="enter your journey plans" name="" id="">
    <button class="start" onclick="starts()" >Start</button>
    <button class="next"  onclick="nexts()" >Next</button>
</div>


    </div>

    <div id="hot" class="hotels">
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    </div>

    




   <script src="https://assets.codepen.io/2940219/tacosontitan-1.1.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
   <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js"></script>
   <script>
function starts() {
    var name = document.querySelector('#start');
    var next = document.querySelector('.next');
    var start= document.querySelector(".start");
    name.style.transition = "width 3s ease-in-out 1s";
    name.style.display = "block";
    name.style.width = "300px";
    name.style.borderRadius = "10px 0 0 10px";
    next.style.borderRadius= "0px 10px 10px 0px";
    next.style.color="white";
    next.style.backgroundColor="#4311bc";
    start.style.display="none";
    next.style.display="block";
}

function nexts() {
    var nex = document.querySelector('.hotels');
     nex.style.display="flex";
     window.location="#hot";
}



   </script>
</body>
</html>
